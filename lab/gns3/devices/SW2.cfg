! VaultBreak — SW2 (Cisco IOSvL2 DMZ access switch)
! Role: DMZ segment. Holds DVWA-Server (VLAN 10) and the DMZ-side plug.
!   Gi1/0/1 : trunk  -> SW1 (DHCP snooping trust)
!   Gi1/0/2 : access VLAN10 -> DVWA-Server 192.168.10.20  (PortFast + Port Security)
!   Gi1/0/3 : access VLAN10 -> (Kali DMZ leg)             (PortFast + Port Security)
!
! NOTE: Dynamic ARP Inspection is intentionally NOT enabled here. DAI validates
! ARP against DHCP snooping bindings, and DMZ hosts (DVWA 192.168.10.20) use
! static IPs — DAI would drop their legitimate ARP on the untrusted access port.
! The DAI story belongs to SW3 (VLAN 20, Case 02).
!
! "Before hardening" baseline: drop the port-security / BPDU guard / PortFast
! lines and leave DTP alone so an attacker's switch can stomach a trunk.
!
hostname SW2
!
no ip domain-lookup
!
vlan 10
 name DMZ
vlan 999
 name NATIVE
!
spanning-tree mode rapid-pvst
no spanning-tree vlan 1
!
! --- per-port hardening (access ports) --------------------------------------
interface GigabitEthernet1/0/1
 description ==> trunk to SW1 / TRUSTED
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport nonegotiate
 ip dhcp snooping trust
 no shutdown
!
interface GigabitEthernet1/0/2
 description ==> DMZ access: DVWA-Server
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 no shutdown
!
interface GigabitEthernet1/0/3
 description ==> DMZ access: Kali (DMZ leg)
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 no shutdown
!
! --- switch-wide DHCP snooping (feeds DAI on SW3 over the trunk) -------------
ip dhcp snooping
ip dhcp snooping vlan 10,20,99
!
interface Vlan99
 ip address 192.168.99.3 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1
!
banner motd ^C
VaultBreak switch SW2 (DMZ) - authorized access only.
^C
!
end