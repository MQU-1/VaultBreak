! VaultBreak — SW1 (Cisco IOSvL2 core switch)
! Role: trunk backbone. Every inter-VLAN hop crosses here.
!   Gi1/0/1 : trunk  -> R1   (DHCP snooping TRUSTED uplink)
!   Gi1/0/2 : trunk  -> SW2  (DMZ access switch)
!   Gi1/0/3 : trunk  -> SW3  (INTERNAL access switch)
!   Vlan99  : management 192.168.99.2/24
! Kept entirely off VLAN 1: native VLAN is 999 named "NATIVE".
!
hostname SW1
!
no ip domain-lookup
!
vlan 10
 name DMZ
vlan 20
 name INTERNAL
vlan 99
 name MGMT
vlan 999
 name NATIVE
!
ip dhcp snooping
ip dhcp snooping vlan 10,20,99
!
spanning-tree mode rapid-pvst
no spanning-tree vlan 1           ! keep everything off VLAN 1
!
interface GigabitEthernet1/0/1
 description ==> trunk to R1 / TRUSTED
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport nonegotiate
 ip dhcp snooping trust
 no shutdown
!
interface GigabitEthernet1/0/2
 description ==> trunk to SW2 (DMZ)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport nonegotiate
 ip dhcp snooping trust
 no shutdown
!
interface GigabitEthernet1/0/3
 description ==> trunk to SW3 (INTERNAL)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport nonegotiate
 ip dhcp snooping trust
 no shutdown
! 
interface Vlan99
 ip address 192.168.99.2 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1
!
ip ssh version 2
line vty 0 4
 transport input ssh
!
banner motd ^C
VaultBreak core switch - authorized access only.
^C
!
end