! VaultBreak — SW3 (Cisco IOSvL2 INTERNAL access switch)
! Role: VLAN 20 internal segment. Hosts Employee-PC1 and the attacker's L2 leg.
!   Gi1/0/1 : trunk  -> SW1  (DHCP snooping TRUST / DAI TRUST — the validated uplink)
!   Gi1/0/2 : access VLAN20 -> Employee-PC1 (PortFast + Port Security)
!   Gi1/0/3 : access VLAN20 -> Kali (L2/ARP leg) (PortFast + Port Security)
!
! Defenses here are the Case 02 centerpiece:
!   DHCP Snooping builds the IP->MAC binding table.
!   Dynamic ARP Inspection (DAI) validates every ARP reply against it.
! With DAI on, arpspoof's forged replies are dropped (see "show ip arp inspection").
!
! PC1 takes a lease (=> DHCP snooping binding). The attacker's ETH2 leg is a
! STATIC 192.168.20.66, so it gets an explicit ARP-ACL permit below — without
! it DAI would drop the Kali leg's legitimate ARP too. Spoofed replies claiming
! PC1's IP with the attacker's MAC match neither the ACL nor a binding, and are
! dropped as Invalid.
!
! "Before hardening" baseline: remove the ARP ACL + `ip arp inspection vlan 20`
! (+ the dhcp snooping vlan 20 line and trust statements).
!
hostname SW3
!
no ip domain-lookup
!
vlan 20
 name INTERNAL
vlan 999
 name NATIVE
!
! --- DHCP snooping feeds the DAI binding table ------------------------------
ip dhcp snooping
ip dhcp snooping vlan 10,20,99
!
! --- Dynamic ARP Inspection -------------------------------------------------
arp access-list STATIC_HOSTS
 permit ip host 192.168.20.66 mac 0000.0000.0000 ffff.ffff.ffff
!
ip arp inspection vlan 20
ip arp inspection validate src-mac dst-mac ip
ip arp inspection filter STATIC_HOSTS vlan 20
!
spanning-tree mode rapid-pvst
no spanning-tree vlan 1
!
interface GigabitEthernet1/0/1
 description ==> trunk to SW1 / TRUSTED
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface GigabitEthernet1/0/2
 description ==> VLAN20 access: Employee-PC1
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 no shutdown
!
interface GigabitEthernet1/0/3
 description ==> VLAN20 access: Kali (L2/ARP leg)
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 no shutdown
!
interface Vlan99
 ip address 192.168.99.4 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1
!
banner motd ^C
VaultBreak switch SW3 (INTERNAL) - authorized access only.
^C
!
end